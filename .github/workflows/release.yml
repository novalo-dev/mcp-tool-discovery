name: Release

# When develop is merged into main with a new version section at the top of
# CHANGELOG.md, this tags the merge and publishes the release with that
# section as its notes. Packagist reads the tag; nothing is uploaded by hand.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    name: Tag and publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Version and notes
        id: version
        run: |
          VERSION=$(grep -m1 -oE '^## [0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | cut -c4-)
          if [ -z "$VERSION" ]; then echo "No released version in CHANGELOG.md"; exit 0; fi
          if awk '/^## Unreleased/ {on=1; next} /^## / && on {exit} on' CHANGELOG.md | grep -q '[^[:space:]]'; then
            echo "::error::Something is still under Unreleased in CHANGELOG.md"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already published: nothing to do."; exit 0
          fi
          awk -v v="## $VERSION" '$0 ~ "^"v {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Tag and release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md
