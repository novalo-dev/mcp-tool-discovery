name: CI

# Every push to develop and every pull request runs the whole suite. main only
# receives develop through a pull request, so it is checked on the way in.
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Coding standard, static analysis, hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2
      - name: Composer file
        run: composer validate --strict
      - name: Install
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Coding standard
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - name: PHPStan, level max on the library
        run: vendor/bin/phpstan analyse --no-progress --error-format=github --memory-limit=512M
      - name: PHPStan on the tests
        run: vendor/bin/phpstan analyse -c phpstan-tests.neon --no-progress --error-format=github --memory-limit=512M
      - name: Hygiene of the files
        run: php bin/check-hygiene.php
      - name: Hygiene of the commit messages
        # A commit that credits the work to a tool is refused here, before it
        # can reach develop, since history is not rewritten afterwards.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then RANGE="$HEAD"; else RANGE="$BASE..$HEAD"; fi
          php bin/check-hygiene.php --commits "$RANGE"

  compatibility:
    # The tests prove the code they run, on each PHP of the matrix. This reads
    # every construct, function and class against each version from 8.1 up,
    # so code that only works on a newer PHP fails here, not on a server.
    name: PHP 8.1+ compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2, cs2pr
      - name: Install
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHPCompatibility
        # cs2pr turns each finding into an annotation on the file and line.
        run: vendor/bin/phpcs -q --standard=phpcompatibility.xml --report=checkstyle | cs2pr

  tests:
    name: Tests on PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Install
        # The lock is resolved for PHP 8.1 (config.platform), the lowest the
        # library supports, so every PHP of the matrix runs the same versions.
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Official MCP schemas
        run: php bin/fetch-schemas.php
      - name: PHPUnit
        # Skipped tests fail the run: a conformance test skipped for a missing
        # schema would otherwise look like a pass.
        # The SDK, ReactPHP, Symfony, Laravel and laravel/mcp suites need
        # their example installed: their own jobs run them.
        run: vendor/bin/phpunit --fail-on-skipped --exclude-testsuite sdk,react,symfony,laravel,laravel-mcp

  package:
    name: What Composer installs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: The archive holds the library and nothing else
        run: |
          git archive --format=tar HEAD | tar -t > files.txt
          cat files.txt
          for f in composer.json LICENSE README.md src/Discovery.php; do
            grep -qx "$f" files.txt || { echo "::error::$f is missing from the package"; exit 1; }
          done
          if grep -E '^(tests|bin|docs|\.github)/' files.txt; then
            echo "::error::The package carries files a host does not need"; exit 1
          fi

  sdk:
    # The example on the official PHP SDK, installed at the exact version the
    # example pins, so a host copies code that is proved to run. Left out of
    # CI passed while the SDK is below 1.0: a change on its side is read and
    # the example fixed, it does not block the library. mcp/sdk never enters
    # the library's own composer.json.
    name: Example on the official PHP SDK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          # The lowest PHP the SDK supports.
          php-version: '8.2'
          coverage: none
          tools: composer:v2
      - name: Install the library's tools
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Install the example
        working-directory: docs/examples/sdk
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHPStan on the example
        run: vendor/bin/phpstan analyse -c docs/examples/sdk/phpstan.neon --no-progress --error-format=github --memory-limit=512M
      - name: PHPUnit
        run: vendor/bin/phpunit --testsuite sdk --fail-on-skipped

  react:
    # The example of a server that stays up, on ReactPHP, installed at the
    # exact version the example pins. ReactPHP is stable (1.x) and pinned,
    # so a failure here comes from this repository: it is part of CI passed.
    name: Example on ReactPHP
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          # The lowest PHP the library supports: the example needs no more.
          php-version: '8.1'
          coverage: none
          tools: composer:v2
      - name: Install the library's tools
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Install the example
        working-directory: docs/examples/react
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHPStan on the example
        run: vendor/bin/phpstan analyse -c docs/examples/react/phpstan.neon --no-progress --error-format=github --memory-limit=512M
      - name: PHPUnit
        run: vendor/bin/phpunit --testsuite react --fail-on-skipped

  symfony:
    # The example of a Symfony application, installed at the exact version
    # of symfony/framework-bundle the example pins. Symfony 6.4 is a
    # long-term release, the lowest that runs on PHP 8.1, and pinned, so a
    # failure here comes from this repository: it is part of CI passed.
    name: Example on Symfony
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          # The lowest PHP the library supports: the example needs no more.
          php-version: '8.1'
          coverage: none
          tools: composer:v2
      - name: Install the library's tools
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Install the example
        working-directory: docs/examples/symfony
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHPStan on the example
        run: |
          vendor/bin/phpstan analyse -c docs/examples/symfony/phpstan.neon --no-progress --error-format=github --memory-limit=512M
          vendor/bin/phpstan analyse -c docs/examples/symfony/phpstan-tests.neon --no-progress --error-format=github --memory-limit=512M
      - name: PHPUnit
        run: vendor/bin/phpunit --testsuite symfony --fail-on-skipped

  laravel:
    # The example of a Laravel application, installed at the exact version
    # of laravel/framework the example pins. Pinned, so a failure here comes
    # from this repository: it is part of CI passed.
    name: Example on Laravel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          # The lowest PHP Laravel 13 runs on.
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Install the library's tools
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Install the example
        working-directory: docs/examples/laravel
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHPStan on the example
        run: |
          vendor/bin/phpstan analyse -c docs/examples/laravel/phpstan.neon --no-progress --error-format=github --memory-limit=1G
          vendor/bin/phpstan analyse -c docs/examples/laravel/phpstan-tests.neon --no-progress --error-format=github --memory-limit=1G
      - name: PHPUnit
        run: vendor/bin/phpunit --testsuite laravel --fail-on-skipped

  laravel-mcp:
    # The example written with laravel/mcp, Laravel's official MCP package,
    # installed at the exact versions of laravel/framework and laravel/mcp
    # the example pins. laravel/mcp is past 1.0 and both are pinned, so a
    # failure here comes from this repository: it is part of CI passed.
    name: Example on laravel/mcp
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          # The lowest PHP Laravel 13 runs on.
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Install the library's tools
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Install the example
        working-directory: docs/examples/laravel-mcp
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHPStan on the example
        run: |
          vendor/bin/phpstan analyse -c docs/examples/laravel-mcp/phpstan.neon --no-progress --error-format=github --memory-limit=1G
          vendor/bin/phpstan analyse -c docs/examples/laravel-mcp/phpstan-tests.neon --no-progress --error-format=github --memory-limit=1G
      - name: PHPUnit
        run: vendor/bin/phpunit --testsuite laravel-mcp --fail-on-skipped

  passed:
    name: CI passed
    # One stable name for the required check, whatever the matrix becomes.
    if: always()
    needs: [quality, compatibility, tests, package, react, symfony, laravel, laravel-mcp]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job is green
        run: |
          [ "${{ needs.quality.result }}" = success ] && [ "${{ needs.compatibility.result }}" = success ] && [ "${{ needs.tests.result }}" = success ] && [ "${{ needs.package.result }}" = success ] && [ "${{ needs.react.result }}" = success ] && [ "${{ needs.symfony.result }}" = success ] && [ "${{ needs.laravel.result }}" = success ] && [ "${{ needs.laravel-mcp.result }}" = success ]
