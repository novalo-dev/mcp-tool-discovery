name: Conformance

# Scores the answers of the library against the official schema of each MCP
# revision, and the search against its benchmark, then publishes the scores
# as badge files on the badges branch, which the README reads.
on:
  push:
    branches: [develop]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance
  cancel-in-progress: false

jobs:
  score:
    name: Protocol conformance and search benchmark
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Install
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Official MCP schemas
        run: php bin/fetch-schemas.php
      - name: Conformance per revision
        run: php bin/conformance.php | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Search benchmark
        run: php bin/benchmark.php | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: badges
          path: build/badges/

  publish:
    name: Publish the badges
    needs: score
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    permissions:
      # Only this job writes, and only to the badges branch: never main, never
      # develop.
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: badges
          path: badges
      - name: Push to the badges branch
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd badges
          git init -q -b badges
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Badges for ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${REPO}.git" badges
